name: Moonlight

options:
  bundleIdPrefix: com.joaocosta
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "27.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    MARKETING_VERSION: 0.1.0-pre-alpha.3
    CURRENT_PROJECT_VERSION: 26
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
  configs:
    Release:
      # A secure timestamp is required for notarization; without it the upload
      # is accepted and then rejected.
      OTHER_CODE_SIGN_FLAGS: --timestamp
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  MoonlightKit:
    path: Packages/MoonlightKit

targets:
  Moonlight:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: App/Moonlight
    info:
      path: App/Moonlight/Info.plist
      properties:
        CFBundleDisplayName: Moonlight
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSAppleEventsUsageDescription: Moonlight lists your shortcuts so you can add them as commands.
        NSServices:
          - NSMenuItem:
              default: Send Text to Moonlight
            NSMessage: sendTextToMoonlight
            NSPortName: Moonlight
            NSSendTypes:
              - public.utf8-plain-text
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joaocosta.Moonlight
        PRODUCT_NAME: Moonlight
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 33FPG9442W
        CODE_SIGN_ENTITLEMENTS: App/Moonlight/Moonlight.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Moonlight
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
    dependencies:
      - target: MoonlightAppIntentsExtension
      - target: MoonlightWidgets
      - package: MoonlightKit
        product: MoonlightIntents
      - package: MoonlightKit
        product: MoonlightAppUI
      - package: MoonlightKit
        product: MoonlightShortcuts

  MoonlightAppIntentsExtension:
    type: extensionkit-extension
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: App/MoonlightAppIntentsExtension
    info:
      path: App/MoonlightAppIntentsExtension/Info.plist
      properties:
        CFBundleDisplayName: Moonlight App Intents
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.appintents-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joaocosta.Moonlight.AppIntentsExtension
        PRODUCT_NAME: MoonlightAppIntentsExtension
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 33FPG9442W
        CODE_SIGN_ENTITLEMENTS: App/MoonlightAppIntentsExtension/MoonlightAppIntentsExtension.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: MoonlightKit
        product: MoonlightIntents

  MoonlightWidgets:
    type: app-extension
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: App/MoonlightWidgets
    info:
      path: App/MoonlightWidgets/Info.plist
      properties:
        CFBundleDisplayName: Moonlight Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joaocosta.Moonlight.Widgets
        PRODUCT_NAME: MoonlightWidgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 33FPG9442W
        CODE_SIGN_ENTITLEMENTS: App/MoonlightWidgets/MoonlightWidgets.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: MoonlightKit
        product: MoonlightIntents

  MoonlightTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: App/MoonlightTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joaocosta.MoonlightTests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 33FPG9442W
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: MoonlightKit
        product: MoonlightAppUI

  MoonlightAppIntentsUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: App/MoonlightAppIntentsUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joaocosta.MoonlightAppIntentsUITests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 33FPG9442W
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_TARGET_NAME: Moonlight
    dependencies:
      - target: Moonlight

schemes:
  Moonlight:
    build:
      targets:
        Moonlight: all
        MoonlightAppIntentsExtension: all
        MoonlightWidgets: all
        MoonlightTests: [test]
        MoonlightAppIntentsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: MoonlightTests
        - name: MoonlightAppIntentsUITests
